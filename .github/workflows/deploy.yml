name: Deploy

# Auto-ship: every push to a deploy branch builds the site and deploys the
# Worker (static assets + /api/chat Workers AI) to Cloudflare.
on:
  push:
    branches:
      - main
      - claude/terminal-portfolio-vite-yVenn
  workflow_dispatch: {}

# Don't let overlapping pushes race each other onto the same Worker.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
